apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-database-bootstrap
  namespace: keycloak
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak-database-bootstrap
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: docker.io/library/postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu
              test "$DB_USERNAME" != "$PGUSER"
              test "$DB_NAME" = "keycloak"

              psql --no-psqlrc --set=ON_ERROR_STOP=1 \
                --set=db_name="$DB_NAME" \
                --set=db_user="$DB_USERNAME" \
                --set=db_password="$DB_PASSWORD" <<'SQL'
              SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'db_user', :'db_password')
              WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'db_user')
              \gexec

              SELECT format(
                'ALTER ROLE %I WITH LOGIN PASSWORD %L NOCREATEDB NOCREATEROLE',
                :'db_user', :'db_password'
              )
              \gexec

              SELECT format('CREATE DATABASE %I OWNER %I', :'db_name', :'db_user')
              WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = :'db_name')
              \gexec

              SELECT format('ALTER DATABASE %I OWNER TO %I', :'db_name', :'db_user')
              \gexec
              SQL

              bootstrap_ok="$(
                psql --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align \
                  --set=db_name="$DB_NAME" --set=db_user="$DB_USERNAME" <<'SQL'
              SELECT EXISTS (
                SELECT 1
                FROM pg_roles AS r
                JOIN pg_database AS d ON d.datdba = r.oid
                WHERE r.rolname = :'db_user'
                  AND d.datname = :'db_name'
                  AND r.rolcanlogin
                  AND NOT r.rolsuper
                  AND NOT r.rolcreatedb
                  AND NOT r.rolcreaterole
                  AND NOT r.rolreplication
                  AND r.rolname <> current_user
              ) AND NOT EXISTS (
                SELECT 1
                FROM pg_roles AS r
                JOIN pg_database AS d ON d.datdba = r.oid
                WHERE r.rolname = :'db_user'
                  AND d.datname <> :'db_name'
              );
              SQL
              )"

              test "$bootstrap_ok" = "t"
              echo "Keycloak database bootstrap verified"
          env:
            - name: PGHOST
              value: aws-eks-terraform-lab-postgres-primary.c3888iw0yn00.ap-northeast-1.rds.amazonaws.com
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: postgres
            - name: PGUSER
              value: taskuser
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-bootstrap
                  key: MASTER_PASSWORD
            - name: PGSSLMODE
              value: require
            - name: PGCONNECT_TIMEOUT
              value: "10"
            - name: DB_NAME
              value: keycloak
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-bootstrap
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-bootstrap
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
