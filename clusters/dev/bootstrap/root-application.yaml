apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-root
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/leehrm/gitops-argocd.git
    targetRevision: deploy/dev
    path: clusters/dev/applications

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
