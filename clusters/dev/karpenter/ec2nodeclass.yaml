apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  amiFamily: AL2023

  amiSelectorTerms:
    - alias: al2023@latest

  instanceProfile: KarpenterNodeInstanceProfile-aws-eks-terraform-lab-eks

  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: aws-eks-terraform-lab-eks

  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: aws-eks-terraform-lab-eks

  tags:
    Name: aws-eks-terraform-lab-karpenter-node
    karpenter.sh/discovery: aws-eks-terraform-lab-eks
