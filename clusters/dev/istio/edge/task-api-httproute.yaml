apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: task-api-istio
  namespace: argo-task-api-istio
spec:
  parentRefs:
    - name: task-api-istio-gateway
      namespace: istio-ingress
      sectionName: http
  rules:
    - matches:
        - path:
            type: Exact
            value: /version
        - path:
            type: Exact
            value: /healthz
        - path:
            type: Exact
            value: /readyz
      backendRefs:
        - name: argo-task-api-istio
          port: 8000
