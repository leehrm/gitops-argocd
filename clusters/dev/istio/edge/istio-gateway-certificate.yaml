apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: istio-gateway-lhrm-lab-com-tls
  namespace: istio-ingress
spec:
  secretName: istio-gateway-lhrm-lab-com-tls
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-staging-gateway
  dnsNames:
    - task-api-istio.lhrm-lab.com
    - kiali.lhrm-lab.com
