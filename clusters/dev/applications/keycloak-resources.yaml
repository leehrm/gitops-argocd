apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak-resources
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default

  source:
    repoURL: https://github.com/leehrm/gitops-argocd.git
    targetRevision: deploy/dev
    path: clusters/dev/identity/keycloak

  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
