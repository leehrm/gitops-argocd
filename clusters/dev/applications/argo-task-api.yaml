apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-task-api
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/leehrm/task-api-platform.git
    targetRevision: main
    path: helm/task-api
    helm:
      values: |
        image:
          repository: 519330023984.dkr.ecr.ap-northeast-1.amazonaws.com/task-api
          tag: "024df20"
          pullPolicy: Always

        env:
          DB_HOST: argo-task-api-postgresdb
          DB_PORT: "5432"
          DB_NAME: taskdb
          DB_USER: taskuser
          DB_PASSWORD: taskpass

        ingress:
          enabled: false

        resources:
          requests:
            cpu: "500m"
            memory: "128Mi"
          limits:
            cpu: "1000m"
            memory: "256Mi"
              
        nodeSelector:
          workload: karpenter

        autoscaling:
          enabled: true
          minReplicas: 1
          maxReplicas: 6
          targetCPUUtilizationPercentage: 20

  destination:
    server: https://kubernetes.default.svc
    namespace: argo-task-api

  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: argo-task-api
      namespace: argo-task-api
      jsonPointers:
        - /spec/replicas

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
