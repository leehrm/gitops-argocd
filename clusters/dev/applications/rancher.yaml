apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rancher
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: https://releases.rancher.com/server-charts/stable
    chart: rancher
    targetRevision: 2.14.3
    helm:
      values: |
        hostname: rancher.lhrm-lab.com
        replicas: 1

        image:
          tag: v2.14.3

        networkExposure:
          type: ingress

        ingress:
          enabled: true
          ingressClassName: traefik
          tls:
            source: secret
            secretName: tls-rancher-ingress

        resources:
          requests:
            cpu: "1"
            memory: 2Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: cattle-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
