apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis
  namespace: argocd
spec:
  project: default

  source:
    repoURL: registry-1.docker.io/bitnamicharts
    chart: redis
    targetRevision: 25.5.3
    helm:
      values: |
        architecture: standalone

        auth:
          enabled: true
          password: "redispass"

        master:
          persistence:
            enabled: false

        replica:
          replicaCount: 0

        metrics:
          enabled: true
          serviceMonitor:
            enabled: true
            namespace: monitoring
            interval: 15s
            labels:
              release: kube-prometheus-stack

  destination:
    server: https://kubernetes.default.svc
    namespace: redis

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
