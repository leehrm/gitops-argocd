apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default

  source:
    repoURL: https://kubernetes-sigs.github.io/external-dns/
    chart: external-dns
    targetRevision: 1.21.1
    helm:
      values: |
        provider:
          name: cloudflare

        sources:
          - ingress
          - gateway-httproute

        domainFilters:
          - lhrm-lab.com

        policy: upsert-only

        registry: txt
        txtOwnerId: eks-dev
        txtPrefix: edns-

        # --cloudflare-proxied 는 지정하지 않는다.
        # kingpin 이 불리언 플래그의 =false 형식을 거부해 기동에 실패한다
        # (flag parsing error: unexpected false).
        # 기본값이 이미 false(DNS only)이며, 필요하면 Ingress 의
        # external-dns.alpha.kubernetes.io/cloudflare-proxied annotation 으로 켠다.
        extraArgs:
          - --ingress-class=traefik

        env:
          - name: CF_API_TOKEN
            valueFrom:
              secretKeyRef:
                name: cloudflare-api-token
                key: api-token

  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
